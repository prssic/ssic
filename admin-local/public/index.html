<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Local SSIC</title>
    <style>
        :root {
            --primary: #522B56; /* Accent color from SSIC */
            --bg: #f9f9f9;
            --surface: #ffffff;
            --border: #e0e0e0;
            --text: #333;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        button { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        button.secondary { background: #eee; color: #333; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .tab { padding: 8px 16px; cursor: pointer; border-radius: 6px; font-weight: bold; color: #666; }
        .tab.active { background: var(--primary); color: white; }
        
        .post-list { display: grid; gap: 10px; }
        .post-item { background: var(--surface); padding: 16px; border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .post-info h3 { margin: 0 0 5px 0; }
        .post-info p { margin: 0; color: #666; font-size: 0.9em; }
        .post-actions { display: flex; gap: 10px; }
        
        #editor { display: none; background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="date"], textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        textarea { min-height: 200px; resize: vertical; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        input[type="checkbox"] { width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Admin SSIC (Local)</h1>
            <button id="btn-new">Adaugă Anunț</button>
        </header>
        
        <div id="dashboard">
            <div class="tabs">
                <div class="tab active" data-tab="curent">Curente</div>
                <div class="tab" data-tab="arhivat">Arhivate</div>
                <div class="tab" data-tab="programat">Programate / Draft</div>
            </div>
            
            <div id="posts-container" class="post-list">
                Încărcare...
            </div>
        </div>
        
        <div id="editor">
            <h2 id="editor-title">Editează Anunț</h2>
            <form id="post-form">
                <input type="hidden" id="originalSlug">
                <div class="form-group">
                    <label>Titlu</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label>URL / Slug (opțional)</label>
                    <input type="text" id="slug" placeholder="se-genereaza-automat">
                </div>
                <div class="form-group">
                    <label>Dată</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>Scurtă Descriere</label>
                    <textarea id="description" style="min-height: 60px;"></textarea>
                </div>
                <div class="form-group">
                    <label>Imagine de Copertă (Alege fisier sau pune link)</label>
                    <input type="file" id="imageFile" accept="image/*" style="margin-bottom: 10px;">
                    <input type="text" id="image" placeholder="/assets/avizier/poza.jpg">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="draft">
                    <label for="draft" style="margin: 0;">Ascuns / Programat (Draft)</label>
                </div>
                <div class="form-group">
                    <label>Conținut (Markdown)</label>
                    <textarea id="content" required></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit">Salvează</button>
                    <button type="button" class="secondary" id="btn-cancel">Anulează</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allPosts = [];
        let currentTab = 'curent';
        
        const dashboard = document.getElementById('dashboard');
        const editor = document.getElementById('editor');
        const postsContainer = document.getElementById('posts-container');
        const form = document.getElementById('post-form');
        
        async function loadPosts() {
            try {
                const res = await fetch('/api/posts');
                allPosts = await res.json();
                renderPosts();
            } catch (e) {
                postsContainer.innerHTML = '<p style="color:red">Eroare la conectarea cu serverul local.</p>';
            }
        }
        
        function renderPosts() {
            const today = new Date().toISOString().split('T')[0];
            
            const programate = [];
            const curente_toate = [];
            
            allPosts.forEach(p => {
                const isDraft = p.data.draft === true;
                const postDate = p.data.date ? new Date(p.data.date).toISOString().split('T')[0] : '';
                
                if (isDraft || postDate > today) {
                    programate.push(p);
                } else {
                    curente_toate.push(p);
                }
            });
            
            const curente = curente_toate.slice(0, 10);
            const arhivate = curente_toate.slice(10);
            
            let listToRender = [];
            if (currentTab === 'curent') listToRender = curente;
            if (currentTab === 'arhivat') listToRender = arhivate;
            if (currentTab === 'programat') listToRender = programate;
            
            if (listToRender.length === 0) {
                postsContainer.innerHTML = '<p>Nu există niciun anunț în această categorie.</p>';
                return;
            }
            
            postsContainer.innerHTML = listToRender.map(p => \
                <div class="post-item">
                    <div class="post-info">
                        <h3>\</h3>
                        <p>Data: \ | Slug: \</p>
                    </div>
                    <div class="post-actions">
                        <button onclick="editPost('\')">Editează</button>
                        <button class="secondary" onclick="deletePost('\')">Șterge</button>
                    </div>
                </div>
            \).join('');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
                t.classList.add('active');
                currentTab = t.dataset.tab;
                renderPosts();
            });
        });
        
        document.getElementById('btn-new').addEventListener('click', () => {
            form.reset();
            document.getElementById('originalSlug').value = '';
            document.getElementById('editor-title').innerText = 'Adaugă Anunț Nou';
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
            dashboard.style.display = 'none';
            editor.style.display = 'block';
        });
        
        document.getElementById('btn-cancel').addEventListener('click', () => {
            editor.style.display = 'none';
            dashboard.style.display = 'block';
        });
        
        window.editPost = (slug) => {
            const post = allPosts.find(p => p.slug === slug);
            if (!post) return;
            
            document.getElementById('originalSlug').value = post.slug;
            document.getElementById('slug').value = post.slug;
            document.getElementById('title').value = post.data.title || '';
            document.getElementById('date').value = post.data.date ? post.data.date.split('T')[0] : '';
            document.getElementById('description').value = post.data.description || '';
            document.getElementById('image').value = post.data.image || '';
            document.getElementById('draft').checked = post.data.draft === true;
            document.getElementById('content').value = post.content || '';
            
            document.getElementById('editor-title').innerText = 'Editează: ' + post.data.title;
            dashboard.style.display = 'none';
            editor.style.display = 'block';
        };
        
        window.deletePost = async (slug) => {
            if (!confirm('Sigur vrei să ștergi acest anunț?')) return;
            await fetch('/api/posts/' + slug, { method: 'DELETE' });
            loadPosts();
        };
        
        document.getElementById('imageFile').addEventListener('change', async (e) => {
            if (!e.target.files[0]) return;
            const formData = new FormData();
            formData.append('image', e.target.files[0]);
            
            const res = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });
            const result = await res.json();
            if (result.success) {
                document.getElementById('image').value = result.url;
            }
        });
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let slug = document.getElementById('slug').value.trim();
            const title = document.getElementById('title').value.trim();
            const date = document.getElementById('date').value;
            
            if (!slug) {
                slug = \\-\\;
            }
            
            const payload = {
                originalSlug: document.getElementById('originalSlug').value,
                slug: slug,
                data: {
                    title: title,
                    date: new Date(date).toISOString(),
                    description: document.getElementById('description').value,
                    image: document.getElementById('image').value,
                    draft: document.getElementById('draft').checked
                },
                content: document.getElementById('content').value
            };
            
            await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            editor.style.display = 'none';
            dashboard.style.display = 'block';
            loadPosts();
        });
        
        loadPosts();
    </script>
</body>
</html>
