<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ page.title | default: "SSIC | Societatea Studenților în Inginerie Chimică și Biotehnologii" }}</title>

    <script src="https://unpkg.com/lucide@0.469.0" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. SISTEM DE DESIGN & RESET 
           ========================================================================== */
        :root {
            --c-base: #100b19;
            --c-surface: #180f24;
            --c-surface-elevated: #221631;
            --c-primary: #5a2f8a;
            --c-primary-light: #8348c4;
            --c-accent: #f5b027;       
            --c-accent-glow: rgba(245, 176, 39, 0.4);
            --c-accent-2: #c9a6f2;
            --c-accent-2-glow: rgba(201, 166, 242, 0.32);
            --c-white: #ffffff;
            --c-white-off: #e9e2ef;
            --c-gray: #948aa3;

            --c-border-hairline: rgba(255,255,255,0.06);
            --c-border-soft: rgba(255,255,255,0.07);
            --c-border: rgba(255,255,255,0.09);
            --c-border-strong: rgba(255,255,255,0.12);
            --c-border-med: rgba(255,255,255,0.22);
            --c-overlay-hover: rgba(255,255,255,0.1);
            --c-shadow-1: rgba(0,0,0,0.5);
            --c-shadow-2: rgba(0,0,0,0.6);
            --c-nav-bg: rgba(20, 13, 30, 0.9);
            --c-nav-bg-solid: rgba(20, 13, 30, 0.97);
            --c-footer-bg: #0c0812;
            --c-cursor-ring: rgba(255,255,255,0.4);
            --c-scheme: dark;

            --font-main: "Jost", system-ui, sans-serif;
            --font-display: "IBM Plex Sans", system-ui, sans-serif;
            --font-mono: "Space Mono", ui-monospace, "SF Mono", monospace;
            
            --ease-out: cubic-bezier(0.2, 1, 0.2, 1);
            --ease-in-out: cubic-bezier(0.8, 0, 0.2, 1);
            --transition-fast: 0.3s var(--ease-out);
            --transition-smooth: 0.8s var(--ease-out);
            
            --z-bg: 0; --z-content: 10; --z-nav: 100; --z-cursor: 9998; --z-swipe: 9999;
            --glass-saturation: 1.5;
        }

        *, *::before, *::after {
            box-sizing: border-box; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) and (pointer: fine) {
            *, *::before, *::after { cursor: none !important; }
        }

        html, body {
            width: 100%; height: 100%; overflow: hidden; 
            background-color: var(--c-base); color: var(--c-white-off);
            font-family: var(--font-main); -webkit-font-smoothing: antialiased;
        }

        .lucide, svg.icon-brand {
            width: 1em; height: 1em; vertical-align: -0.125em; flex-shrink: 0;
        }
        .lucide { stroke-width: 1.75; }
        svg.icon-brand { fill: currentColor; }

        h1, h2, h3, h4 { 
            font-family: var(--font-display); 
            font-weight: 700; 
            line-height: 1.1; 
            letter-spacing: -0.02em; 
            color: var(--c-white);
        }
        
        p { font-size: 1.15rem; color: var(--c-gray); line-height: 1.6; font-weight: 500; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        .noise {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9997; opacity: 0.05; mix-blend-mode: overlay;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)"/%3E%3C/svg%3E');
        }

        .cursor {
            position: fixed; top: 0; left: 0; width: 10px; height: 10px;
            background: var(--c-accent); border-radius: 50%;
            pointer-events: none; z-index: var(--z-cursor);
            transform: translate(-50%, -50%);
            transition: width 0.2s var(--ease-out), height 0.2s var(--ease-out), background 0.2s, opacity 0.2s var(--ease-out);
            mix-blend-mode: normal;
        }
        @media (hover: none), (pointer: coarse) {
            .cursor { display: none; }
        }
        .cursor.is-hidden { opacity: 0; }
        .cursor.hovering {
            width: 40px; height: 40px; background: var(--c-overlay-hover);
            border: 1px solid var(--c-cursor-ring);
            backdrop-filter: blur(3px) saturate(var(--glass-saturation));
            -webkit-backdrop-filter: blur(3px) saturate(var(--glass-saturation));
            mix-blend-mode: difference;
        }

        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 90px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 4vw; z-index: var(--z-nav);
            background: var(--c-nav-bg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -12px 24px -12px rgba(255,255,255,0.03);
            transition: transform 0.5s var(--ease-out), opacity 0.4s var(--ease-out);
        }
        .nav-backdrop {
            position: absolute; inset: 0; z-index: -1; pointer-events: none;
            transform: translateZ(0);
            will-change: transform, backdrop-filter;
            contain: paint;
        }
        @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
            nav { background: transparent; }
            .nav-backdrop {
                background: linear-gradient(to bottom, var(--c-nav-bg) 0%, transparent 50%);
                backdrop-filter: blur(22px) saturate(var(--glass-saturation));
                -webkit-backdrop-filter: blur(22px) saturate(var(--glass-saturation));
            }
        }
        @supports (mask-image: linear-gradient(#000, #000)) or (-webkit-mask-image: linear-gradient(#000, #000)) {
            .nav-backdrop {
                height: 200%;
                -webkit-mask-image: linear-gradient(to bottom, black 0% 50%, transparent 50% 100%);
                mask-image: linear-gradient(to bottom, black 0% 50%, transparent 50% 100%);
            }
        }
        nav.nav-hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }
        @media (prefers-reduced-motion: reduce) {
            nav { transition: opacity 0.3s; }
            nav.nav-hidden { transform: none; }
        }

        .scroll-progress {
            position: fixed; top: 0; left: 0; width: 100%; height: 3px;
            z-index: 10001; pointer-events: none; background: transparent;
        }
        .scroll-progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--c-accent), var(--c-accent-2), var(--c-primary-light), var(--c-accent));
            background-size: 300% 100%;
            box-shadow: 0 0 12px var(--c-accent-glow);
            transition: width 0.12s linear;
            animation: progressGradientMove 6s linear infinite;
        }
        @keyframes progressGradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .scroll-progress-fill { animation: none; }
        }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo img { height: 40px; }
        .logo span { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--c-white); letter-spacing: 1px; }
        .logo span i { color: var(--c-accent); font-style: normal; }

        .nav-links { display: flex; gap: 30px; }
        .nav-right { display: flex; align-items: center; gap: 14px; }

        .nav-burger {
            display: none; flex-direction: column; justify-content: center; gap: 6px;
            width: 44px; height: 44px; background: none; border: none; padding: 0;
            z-index: 110; position: relative;
        }
        .nav-burger span {
            display: block; width: 26px; height: 2px; background: var(--c-white);
            border-radius: 2px; transition: transform 0.3s var(--ease-out), opacity 0.3s var(--ease-out);
            margin: 0 auto;
        }
        .nav-burger.is-active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .nav-burger.is-active span:nth-child(2) { opacity: 0; }
        .nav-burger.is-active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        .nav-link {
            font-weight: 800; font-size: 13px; color: #a394b5;
            text-transform: uppercase; letter-spacing: 2px;
            padding: 10px 0; position: relative; display: inline-block;
            transition: color var(--transition-fast);
        }
        .nav-link.active { color: var(--c-white); }
        .nav-link::after {
            content: ''; position: absolute; bottom: 0; left: 50%;
            width: 5px; height: 5px; border-radius: 50%; background: var(--c-accent);
            transform: scale(0) translateX(-50%); transition: transform 0.3s var(--ease-out);
        }
        .nav-link.active::after { transform: scale(1) translateX(-50%); }

        .swipe-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: var(--z-swipe); display: flex; visibility: hidden;
        }
        .swipe-bar { position: absolute; top: 0; width: 100%; height: 100%; will-change: transform; }
        .swipe-bar:nth-child(1) { background: var(--c-primary); z-index: 2; }
        .swipe-bar:nth-child(2) { background: var(--c-white); z-index: 1; }

        .swipe-ltr { visibility: visible; }
        .swipe-ltr .swipe-bar { transform: translateX(-100%); }
        .swipe-ltr.animating .swipe-bar:nth-child(1) { animation: swipeLTR 0.8s var(--ease-in-out) forwards; }
        .swipe-ltr.animating .swipe-bar:nth-child(2) { animation: swipeLTR 0.8s var(--ease-in-out) 0.1s forwards; }

        .swipe-rtl { visibility: visible; }
        .swipe-rtl .swipe-bar { transform: translateX(100%); }
        .swipe-rtl.animating .swipe-bar:nth-child(1) { animation: swipeRTL 0.8s var(--ease-in-out) forwards; }
        .swipe-rtl.animating .swipe-bar:nth-child(2) { animation: swipeRTL 0.8s var(--ease-in-out) 0.1s forwards; }

        @keyframes swipeLTR { 0% { transform: translateX(-100%); } 45%, 55% { transform: translateX(0); } 100% { transform: translateX(100%); } }
        @keyframes swipeRTL { 0% { transform: translateX(100%); } 45%, 55% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .app {
            position: relative; width: 100vw; height: 100vh; height: 100dvh;
            background-color: var(--c-base);
            background-image:
                repeating-linear-gradient(90deg, rgba(90,47,138,0.14) 0px, rgba(90,47,138,0.14) 1px, transparent 1px, transparent 64px),
                repeating-linear-gradient(0deg, rgba(90,47,138,0.14) 0px, rgba(90,47,138,0.14) 1px, transparent 1px, transparent 64px);
            background-repeat: repeat;
            background-size: 64px 64px;
            background-attachment: fixed;
        }
        .view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; visibility: hidden; pointer-events: none; display: none;
            overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth;
            transform: translateZ(0);
        }
        .view.active { opacity: 1; visibility: visible; pointer-events: auto; display: block; }
        
        .view::-webkit-scrollbar { display: none; }
        .view { scrollbar-width: none; -ms-overflow-style: none; }

        .title-huge { font-size: clamp(3.8rem, 8.5vw, 7.4rem); line-height: 1.06; color: var(--c-white); margin-bottom: 2.5rem; letter-spacing: -1px; hyphens: manual; word-break: keep-all; overflow-wrap: normal; }
        .title-huge i {
            font-style: normal; position: relative;
            background: linear-gradient(90deg, var(--c-accent), var(--c-accent-2), var(--c-primary-light), var(--c-accent-2), var(--c-accent));
            background-size: 300% 100%;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            animation: titleGradientMove 8s linear infinite;
        }
        @keyframes titleGradientMove { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
        @media (prefers-reduced-motion: reduce) { .title-huge i { animation: none; background-position: 0% 50%; } }

        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        .typed-line { display: inline-block; min-height: 1em; }
        .typed-text { display: inline; color: var(--c-white); }
        .typed-cursor {
            display: inline-block; width: 3px; height: 0.82em; margin-left: 6px; margin-bottom: -0.08em;
            background: var(--c-accent); box-shadow: 0 0 12px var(--c-accent-glow);
            animation: cursorBlink 0.9s steps(1) infinite; vertical-align: baseline;
        }
        .typed-cursor.is-typing { animation: none; opacity: 1; }
        @keyframes cursorBlink { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .typed-cursor { animation: cursorBlink 1.4s steps(1) infinite; } }
        
        .page-content { position: relative; z-index: 0; padding: 180px 6vw 100px; max-width: 1600px; margin: 0 auto; }
        .page-content::before {
            content: ''; position: absolute; top: -40px; left: -10%; right: -10%; height: 380px;
            background: var(--c-base); filter: blur(46px); z-index: -1; pointer-events: none;
        }
        @media (max-width: 768px) { .page-content::before { height: 290px; } }

        .reveal {
            opacity: 0; transform: translateY(36px); filter: blur(6px);
            transition: opacity 0.9s var(--ease-out), transform 0.9s var(--ease-out), filter 0.9s var(--ease-out);
            will-change: opacity, transform, filter;
        }
        .reveal.is-visible { opacity: 1; transform: translateY(0); filter: blur(0); }
        .reveal-stagger.is-visible { transition-delay: var(--r-delay, 0s); }
        @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1 !important; transform: none !important; filter: none !important; transition: none !important; } }

        #view-home { padding: 0; }
        .hero { position: relative; width: 100%; height: 100vh; height: 100svh; display: flex; align-items: center; padding: 0 6vw; background-color: var(--c-base); }
        .hero-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; object-fit: cover; opacity: 0.55; }
        @media (hover: hover) and (pointer: fine) { .hero-video { mix-blend-mode: luminosity; opacity: 0.5; } }
        .hero-grad { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, var(--c-base) 0%, rgba(16,11,25,0.35) 100%); z-index: 1; }
        .hero-content { position: relative; z-index: 2; width: 100%; max-width: 1200px; }

        .home-extended-area { padding: 80px 6vw; max-width: 1600px; margin: 0 auto; }
        .home-huge-stats { display: flex; flex-wrap: wrap; gap: 40px; margin-bottom: 100px; }
        .home-stat { flex: 1; min-width: 300px; }
        .home-stat span { display: block; font-family: var(--font-mono); font-size: 5.4rem; font-weight: 700; color: var(--c-accent); line-height: 1; margin-bottom: 10px; letter-spacing: -0.02em; }
        .home-stat p { font-size: 1.5rem; color: var(--c-white); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .home-about-extended { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; margin-bottom: 100px; }
        .home-about-extended h2 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 30px; }
        .home-about-extended p { font-size: 1.3rem; margin-bottom: 20px; line-height: 1.8; }
        
        .instagram-embed-wrapper { width: 100%; max-width: 370px; margin: 0 auto 150px; }
        .ig-embed-frame { background: var(--c-surface-elevated); border: 1px solid var(--c-border-soft); border-radius: 24px; padding: 14px; overflow: hidden; max-width: 100%; box-shadow: 0 20px 60px var(--c-shadow-1); position: relative; transition: transform var(--transition-fast), box-shadow var(--transition-fast); }
        .ig-embed-frame blockquote.instagram-media, .ig-embed-frame iframe { max-width: 100% !important; width: 100% !important; min-width: 0 !important; display: block !important; border-radius: 16px; }
        .ig-embed-frame blockquote.instagram-media { opacity: 0; position: relative; z-index: 1; transition: opacity 0.5s var(--ease-out); }
        .ig-embed-frame.ig-ready blockquote.instagram-media, .ig-embed-frame.ig-ready iframe { opacity: 1; }
        .ig-embed-skeleton { position: absolute; inset: 14px; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; aspect-ratio: 4 / 5; background: linear-gradient(110deg, var(--c-surface) 30%, var(--c-surface-elevated) 45%, var(--c-surface) 60%); background-size: 220% 100%; animation: igSkeletonShimmer 1.7s linear infinite; transition: opacity 0.4s var(--ease-out); z-index: 0; }
        .ig-embed-skeleton i, .ig-embed-skeleton svg.icon-brand { font-size: 2.1rem; width: 2.1rem; height: 2.1rem; color: var(--c-gray); opacity: 0.4; }
        .ig-embed-skeleton span { font-size: 0.82rem; color: var(--c-gray); font-weight: 600; opacity: 0.6; }
        .ig-embed-frame.ig-ready .ig-embed-skeleton { opacity: 0; pointer-events: none; }
        @keyframes igSkeletonShimmer { 0% { background-position: 220% 0; } 100% { background-position: -220% 0; } }
        @media (prefers-reduced-motion: reduce) { .ig-embed-skeleton { animation: none; } }
        .ig-embed-fallback { display: none; align-items: center; gap: 8px; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--c-accent); }
        .ig-embed-frame.ig-timeout .ig-embed-skeleton i, .ig-embed-frame.ig-timeout .ig-embed-skeleton svg.icon-brand, .ig-embed-frame.ig-timeout .ig-embed-skeleton span { display: none; }
        .ig-embed-frame.ig-timeout .ig-embed-fallback { display: inline-flex; }
        .ig-embed-eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.4px; color: var(--c-accent); }
        .ig-embed-eyebrow i, .ig-embed-eyebrow svg.icon-brand { font-size: 0.95rem; width: 0.95rem; height: 0.95rem; }

        .horizontal-nav { position: relative; display: flex; gap: 4px; margin-bottom: 40px; padding: 6px; border-radius: 14px; background: var(--c-surface-elevated); overflow-x: auto; overflow-y: hidden; max-width: 100%; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .horizontal-nav::-webkit-scrollbar { display: none; }
        .horizontal-tab { flex: 0 0 auto; white-space: nowrap; position: relative; padding: 11px 22px; font-size: 1rem; font-weight: 700; color: var(--c-gray); cursor: pointer; transition: color 0.25s var(--ease-out), background 0.25s var(--ease-out); border-radius: 10px; letter-spacing: 0.1px; background: transparent; }
        .horizontal-tab.active { color: var(--c-base); font-weight: 800; background: var(--c-accent); }
        @media (prefers-reduced-motion: reduce) { .horizontal-tab { transition: none; } }

        .event-content-wrapper, .board-dept, .evsub { display: none; opacity: 0; transform: translateY(14px) scale(0.99); filter: blur(3px); }
        .event-content-wrapper.active, .board-dept.active, .evsub.active { display: block; animation: tabEnter 0.5s var(--ease-out) forwards; }
        .event-content-wrapper.tab-leaving, .board-dept.tab-leaving, .evsub.tab-leaving { display: block; animation: tabLeave 0.22s var(--ease-out) forwards; }
        @keyframes tabEnter { from { opacity: 0; transform: translateY(14px) scale(0.99); filter: blur(3px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        @keyframes tabLeave { from { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } to { opacity: 0; transform: translateY(-10px) scale(0.99); filter: blur(3px); } }
        @media (prefers-reduced-motion: reduce) { .event-content-wrapper, .board-dept, .evsub, .event-content-wrapper.active, .board-dept.active, .evsub.active, .event-content-wrapper.tab-leaving, .board-dept.tab-leaving, .evsub.tab-leaving { animation: none !important; opacity: 1 !important; transform: none !important; filter: none !important; } }
        
        .event-desc { position: relative; margin-bottom: 56px; max-width: 780px; }
        .event-desc p { margin: 0; color: var(--c-white-off); font-size: 1.35rem; font-weight: 400; line-height: 1.65; letter-spacing: -0.01em; }

        .calendar-section { margin-top: 0; }
        .calendar-section h2 { font-size: 1.7rem; margin-bottom: 24px; }
        .calendar-list { display: flex; flex-direction: column; gap: 12px; }
        .calendar-item { display: flex; align-items: center; gap: 20px; padding: 16px 20px; border-radius: 16px; background: var(--c-surface-elevated); border: 1px solid var(--c-border-soft); transition: border-color 0.25s var(--ease-out), transform 0.25s var(--ease-out); }
        .calendar-date { flex: 0 0 auto; width: 62px; height: 62px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--c-base); border: 1px solid var(--c-border-soft); }
        .calendar-date .cal-day { font-size: 1.3rem; font-weight: 800; color: var(--c-white); line-height: 1.1; }
        .calendar-date .cal-month { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--c-accent); }
        .calendar-info h3 { font-size: 1.1rem; font-weight: 800; color: var(--c-white); margin-bottom: 4px; }
        .calendar-info p { font-size: 0.95rem; color: var(--c-gray); font-weight: 500; margin: 0; }
        @media (max-width: 600px) { .calendar-item { gap: 14px; padding: 14px 16px; } .calendar-date { width: 52px; height: 52px; } }

        .carousel-container { width: 100%; max-width: 900px; position: relative; overflow: hidden; border-radius: 16px; margin-top: 30px; }
        .carousel-track { display: flex; width: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; cursor: grab; }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-track:active { cursor: grabbing; }

            const personalLink = document.getElementById('contactPersonalLink');
            const scrollHint = document.getElementById('contactScrollHint');
            if (!overlay) return;

            function refreshScrollHint() {
                if (!scrollHint || !card) return;
                const canScroll = card.scrollHeight > card.clientHeight + 8;
                const nearBottom = card.scrollTop + card.clientHeight >= card.scrollHeight - 12;
                scrollHint.classList.toggle('visible', canScroll && card.scrollTop < 24 && !nearBottom);
            }
            if (card) {
                card.addEventListener('scroll', refreshScrollHint);
                window.addEventListener('resize', refreshScrollHint);
            }

            let lastFocused = null;

            window.openContact = function (id) {
                const p = contactData[id];
                if (!p) return;
                if (typeof haptic === 'function') haptic(10);

                photoEl.innerHTML = `<img src="${p.photo}" alt="${p.name}" loading="lazy" decoding="async">`;

                `;
                if (window.lucide) lucide.createIcons({ root: linesEl });
                personalLink.href = p.personalUrl;

                lastFocused = document.activeElement;
                overlay.classList.add('open');
                overlay.setAttribute('aria-hidden', 'false');
                if (card) card.scrollTop = 0;
                setTimeout(() => closeBtn.focus(), 50);
                requestAnimationFrame(refreshScrollHint);
                setTimeout(refreshScrollHint, 350);
            };

            function closeContact() {
                overlay.classList.remove('open');
                overlay.setAttribute('aria-hidden', 'true');
                if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
            }
            window.closeContact = closeContact;

            closeBtn.addEventListener('click', closeContact);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeContact(); });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.classList.contains('open')) closeContact();
            });
        })();
    </script>

        (function initInstagramReadySwap() {

            if (!frame) return;
            let settled = false;
            const markReady = () => {
                if (settled) return;
                settled = true;
                frame.classList.add('ig-ready');
                observer.disconnect();
            };
            const observer = new MutationObserver(() => {
                if (frame.querySelector('iframe')) markReady();
            });
            observer.observe(frame, { childList: true, subtree: true });
            if (frame.querySelector('iframe')) markReady();
            setTimeout(() => {
                if (settled) return;
                if (frame.querySelector('iframe')) { markReady(); return; }
                frame.classList.add('ig-timeout');

        const revealObserver = new IntersectionObserver((entries) => {

                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    const counter = entry.target.querySelector('[data-count-to]');
                    if (counter) animateCount(counter);
                    if (entry.target.hasAttribute('data-count-to')) animateCount(entry.target);
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });

        function observeReveals() {
            document.querySelectorAll('.reveal:not(.is-observed)').forEach(el => {
                el.classList.add('is-observed');
                revealObserver.observe(el);
            });
        }
        observeReveals();

        (function initHeroTypewriter() {
            const textEl = document.getElementById('heroTyped');
            const cursorEl = document.getElementById('heroCursor');
            const lineEl = textEl ? textEl.closest('.typed-line') : null;
            if (!textEl || !cursorEl) return;

            const phrases = [
                'Inovație în', 'Spirit de echipă în', 'Pasiune pentru',
                'Viitorul tău în', 'Excelență în', 'Curiozitate pentru',
                'Ambiție în', 'Determinare în'
            ];
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduceMotion) {
                textEl.textContent = phrases[0];
                return;
            }

            const TYPE_MIN = 55, TYPE_MAX = 95;
            const DELETE_MIN = 28, DELETE_MAX = 42;
            const HOLD_AFTER_TYPE = 2000;
            const HOLD_AFTER_DELETE = 450;

            let phraseIndex = 0;
            let charIndex = 0;
            let currentPhrase = phrases[0];

            function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
            function pickNextPhrase() {
                phraseIndex = (phraseIndex + 1) % phrases.length;
                return phrases[phraseIndex];
            }

            const measureCanvas = document.createElement('canvas');
            const measureCtx = measureCanvas.getContext('2d');
            function fitLineToViewport(text) {
                if (!lineEl || !measureCtx) return;
                lineEl.style.fontSize = ''; 
                const container = lineEl.closest('.hero-content');
                if (!container) return;
                const style = getComputedStyle(lineEl);
                const baseSize = parseFloat(style.fontSize);
                if (!baseSize) return;
                measureCtx.font = `${style.fontWeight} ${baseSize}px ${style.fontFamily}`;
                const textWidth = measureCtx.measureText(text).width;
                const cursorAllowance = 16; 
                const available = container.clientWidth - cursorAllowance;
                if (available > 0 && textWidth > available) {
                    const scale = Math.max(0.6, available / textWidth);
                    lineEl.style.fontSize = (baseSize * scale) + 'px';
                }
            }

            function typeStep() {
                cursorEl.classList.add('is-typing');
                if (charIndex <= currentPhrase.length) {
                    textEl.textContent = currentPhrase.slice(0, charIndex);
                    charIndex++;
                    setTimeout(typeStep, rand(TYPE_MIN, TYPE_MAX));
                } else {
                    cursorEl.classList.remove('is-typing');
                    setTimeout(deleteStep, HOLD_AFTER_TYPE);
                }
            }

            function deleteStep() {
                cursorEl.classList.add('is-typing');
                if (charIndex >= 0) {
                    textEl.textContent = currentPhrase.slice(0, charIndex);
                    charIndex--;
                    setTimeout(deleteStep, rand(DELETE_MIN, DELETE_MAX));
                } else {
                    cursorEl.classList.remove('is-typing');
                    currentPhrase = pickNextPhrase();
                    fitLineToViewport(currentPhrase);
                    charIndex = 0;
                    setTimeout(typeStep, HOLD_AFTER_DELETE);
                }
            }

            fitLineToViewport(currentPhrase);
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => fitLineToViewport(currentPhrase), 150);
            });
            setTimeout(typeStep, 500);
        })();

        function initDraggableCarousel(trackId, dotsId) {
            const track = document.getElementById(trackId);
            const dotsContainer = document.getElementById(dotsId);
            if(!track || !dotsContainer) return;
            const dots = dotsContainer.querySelectorAll('.carousel-dot');
            track.addEventListener('scroll', () => {
                let index = Math.round(track.scrollLeft / track.offsetWidth);
                if (index >= dots.length) index = dots.length - 1;
                if (index < 0) index = 0;
                dots.forEach((dot, i) => { dot.classList.toggle('active', i === index); });
            });
            let isD = false, sX, sL;
            track.onmousedown = e => { isD = true; sX = e.pageX - track.offsetLeft; sL = track.scrollLeft; cursor.classList.add('hovering'); };
            track.onmouseleave = () => { isD = false; cursor.classList.remove('hovering'); };
            track.onmouseup = () => { isD = false; cursor.classList.remove('hovering'); };
            track.onmousemove = e => { if(!isD) return; e.preventDefault(); track.scrollLeft = sL - (e.pageX - track.offsetLeft - sX)*2; };
        }

                panel.classList.remove('active');
                panel.classList.add('tab-leaving');
                let done = false;
                const cleanup = () => {
                    if (done) return;
                    done = true;
                    panel.classList.remove('tab-leaving');
                    panel.removeEventListener('animationend', cleanup);
                };
                panel.addEventListener('animationend', cleanup);
                setTimeout(cleanup, 300);
            });
            if (nextPanel && !nextPanel.classList.contains('active')) {
                nextPanel.classList.remove('tab-leaving');
                nextPanel.classList.add('active');
            }
        }

            function tick(now) {
                const progress = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);

                if (progress < 1) requestAnimationFrame(tick);

                { group: 'Facultate', title: 'Vizireanu Andreea', sub: 'Consilier · Consiliul Facultății', icon: 'user', view: 'facultate', facDeptId: 'fac-consilieri' },
                { group: 'Facultate', title: 'Nuramet Ener', sub: 'Consilier · Consiliul Facultății', icon: 'user', view: 'facultate', facDeptId: 'fac-consilieri' },
                { group: 'Facultate', title: 'Baicu Bianca', sub: 'Consilier · Consiliul Facultății', icon: 'user', view: 'facultate', facDeptId: 'fac-consilieri' },
                { group: 'Facultate', title: 'Petrescu Erica', sub: 'Consilier · Consiliul Facultății', icon: 'user', view: 'facultate', facDeptId: 'fac-consilieri' },
                { group: 'Facultate', title: 'Soficaru David', sub: 'Consilier · Consiliul Facultății', icon: 'user', view: 'facultate', facDeptId: 'fac-consilieri' },
                { group: 'Facultate', title: 'Petrici Anca', sub: 'Consilier · Consiliul Facultății', icon: 'user', view: 'facultate', facDeptId: 'fac-consilieri' },
                { group: 'Facultate', title: 'Rusu Simon', sub: 'Consilier · Consiliul Facultății', icon: 'user', view: 'facultate', facDeptId: 'fac-consilieri' },
            ];

            const overlay = document.getElementById('searchOverlay');
            const input = document.getElementById('searchInput');
            const resultsEl = document.getElementById('searchResults');
            const openBtn = document.getElementById('navSearchBtn');
            const closeBtn = document.getElementById('searchCloseBtn');
            if (!overlay || !input || !resultsEl || !openBtn) return;

            let activeIndex = -1;
            let currentResults = [];

            const normalize = (str) => str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            function escapeHtml(str) { return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
            function highlight(text, query) {
                if (!query) return escapeHtml(text);
                const nText = normalize(text);
                const nQuery = normalize(query);
                const idx = nText.indexOf(nQuery);
                if (idx === -1) return escapeHtml(text);
                return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx + query.length)) + '</mark>' + escapeHtml(text.slice(idx + query.length));
            }

            function renderResults(query) {
                const q = normalize(query.trim());
                const filtered = q
                    ? searchIndex.filter(item => normalize(item.title).includes(q) || normalize(item.sub).includes(q) || normalize(item.group).includes(q))
                    : searchIndex.filter(item => item.group === 'Secțiuni');
                currentResults = filtered;
                activeIndex = filtered.length ? 0 : -1;

                if (!filtered.length) {
                    resultsEl.innerHTML = `<div class="search-empty">Niciun rezultat pentru „${escapeHtml(query)}”</div>`;
                    return;
                }
                let html = '';
                let lastGroup = null;
                filtered.forEach((item, i) => {
                    if (item.group !== lastGroup) { html += `<div class="search-result-group-label">${escapeHtml(item.group)}</div>`; lastGroup = item.group; }
                    const photoSrc = item.photo || ((item.group === 'Board' || item.group === 'Facultate') ? `assets/team/${slugifyName(item.title)}.jpg` : null);
                    const iconHtml = photoSrc
                        ? `<div class="search-result-icon search-result-photo"><img src="${photoSrc}" alt="" loading="lazy" decoding="async"></div>`
                        : `<div class="search-result-icon"><i data-lucide="${item.icon}"></i></div>`;
                    html += `
                        <div class="search-result-item${i === 0 ? ' is-active' : ''}" data-index="${i}" role="option">
                            ${iconHtml}
                            <div class="search-result-text">
                                <div class="search-result-title">${highlight(item.title, query)}</div>
                                <div class="search-result-sub">${escapeHtml(item.sub)}</div>
                            </div>
                        </div>`;
                });
                resultsEl.innerHTML = html;
                if (window.lucide) lucide.createIcons({ root: resultsEl });
                resultsEl.querySelectorAll('.search-result-item').forEach(el => {
                    el.addEventListener('click', () => selectResult(parseInt(el.dataset.index, 10)));
                });
                resultsEl.querySelectorAll('.search-result-photo img').forEach(img => {
                    img.addEventListener('error', function () {
                        const box = this.closest('.search-result-icon');
                        const item = filtered[parseInt(box.closest('.search-result-item').dataset.index, 10)];
                        box.classList.remove('search-result-photo');
                        box.innerHTML = `<i data-lucide="${item.icon}"></i>`;
                        if (window.lucide) lucide.createIcons({ root: box });
                    });
                });
            }

            function setActive(i) {
                const items = resultsEl.querySelectorAll('.search-result-item');
                items.forEach(el => el.classList.remove('is-active'));
                if (items[i]) {
                    items[i].classList.add('is-active');
                    items[i].scrollIntoView({ block: 'nearest' });
                }
                activeIndex = i;
            }

            function selectResult(i) {
                const item = currentResults[i];
                if (!item) return;
                haptic(10);
                closeSearch();

                const currentView = window.location.pathname === '/' ? 'home' : window.location.pathname.replace(/\//g, '');
                const goToView = (currentView !== item.view);
                if (goToView) {
                    const targetHref = item.view === 'home' ? '/' : '/' + item.view + '/';
                    const link = document.querySelector(`.nav-link[href="${targetHref}"]`);
                    if(link) link.click();
                }

                setTimeout(() => {
                    if (item.eventIndex !== undefined) {
                        const subTab = document.querySelector('#nav-evenimente-sub .horizontal-tab:first-child');
                        if (subTab && !subTab.classList.contains('active') && typeof switchEventSub === 'function') switchEventSub('evsub-events', subTab);
                        const tab = document.querySelector(`#nav-evenimente .horizontal-tab:nth-child(${item.eventIndex + 2})`);
                        if (tab && typeof switchEvent === 'function') switchEvent(item.eventIndex, tab);
                    }
                    if (item.deptId && typeof switchDept === 'function') {
                        const tabs = document.querySelectorAll('#nav-board .horizontal-tab');
                        const deptOrder = ['dept-cd', 'dept-hr', 'dept-pr', 'dept-fr', 'dept-ev'];
                        const tabEl = tabs[deptOrder.indexOf(item.deptId)];
                        if (tabEl) switchDept(item.deptId, tabEl);
                    }
                    if (item.facDeptId && typeof switchFac === 'function') {
                        const tabs = document.querySelectorAll('#nav-facultate .horizontal-tab');
                        const facOrder = ['fac-conducere', 'fac-senatori', 'fac-consilieri'];
                        const tabEl = tabs[facOrder.indexOf(item.facDeptId)];
                        if (tabEl) switchFac(item.facDeptId, tabEl);
                    }

                    let scrollTarget = null;
                    const groupId = item.deptId || item.facDeptId;
                    if (item.targetId) {
                        scrollTarget = document.getElementById(item.targetId);
                    } else if (groupId) {
                        const group = document.getElementById(groupId);
                        if (group) scrollTarget = Array.from(group.querySelectorAll('.team-name')).find(el => el.textContent.trim() === item.title)?.closest('.team-member') || null;
                    }
                    if (scrollTarget) setTimeout(() => scrollTarget.scrollIntoView({ behavior: 'smooth', block: 'center' }), 120);
                }, goToView ? 430 : 0);
            }

            function openSearch() { haptic(10); overlay.classList.add('open'); openBtn.setAttribute('aria-expanded', 'true'); renderResults(''); input.value = ''; setTimeout(() => input.focus(), 50); }
            function closeSearch() { overlay.classList.remove('open'); openBtn.setAttribute('aria-expanded', 'false'); }

            openBtn.addEventListener('click', openSearch);
            closeBtn.addEventListener('click', closeSearch);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSearch(); });
            input.addEventListener('input', () => renderResults(input.value));

            document.addEventListener('keydown', (e) => {
                if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); overlay.classList.contains('open') ? closeSearch() : openSearch(); return; }
                if (!overlay.classList.contains('open')) return;
                if (e.key === 'Escape') { closeSearch(); }
                else if (e.key === 'ArrowDown') { e.preventDefault(); if (currentResults.length) setActive((activeIndex + 1) % currentResults.length); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); if (currentResults.length) setActive((activeIndex - 1 + currentResults.length) % currentResults.length); }
                else if (e.key === 'Enter') { e.preventDefault(); if (activeIndex > -1) selectResult(activeIndex); }
            });
        })();
    </script>

            if (window.lucide) lucide.createIcons();
            
            // Setare link activ inițial în funcție de URL
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            const currentPath = window.location.pathname;
            const activeLink = document.querySelector(`.nav-link[href="${currentPath}"]`) || document.querySelector('.nav-link[href="/"]');
            if (activeLink) activeLink.classList.add('active');

    <!-- PJAX Motor -->
    <script>
    (function initSmoothTransitions() {
        const navOrder = ['/', '/evenimente/', '/board/', '/facultate/', '/studenti/', '/gallery/'];
        let isNavigating = false;

        document.addEventListener('click', async (e) => {
            const link = e.target.closest('a.nav-link') || e.target.closest('a.logo');
            if (!link || link.hostname !== window.location.hostname) return;

            e.preventDefault();
            
            const targetHref = link.href;
            const targetPath = new URL(targetHref).pathname;
            const currentPath = window.location.pathname;

            if (targetPath === currentPath || isNavigating) return;
            isNavigating = true;
            
            if (typeof haptic === 'function') haptic(10);

            const cIdx = navOrder.indexOf(currentPath) > -1 ? navOrder.indexOf(currentPath) : 0;
            const tIdx = navOrder.indexOf(targetPath) > -1 ? navOrder.indexOf(targetPath) : 0;
            const dirClass = tIdx > cIdx ? 'swipe-ltr' : 'swipe-rtl';

            const swiper = document.getElementById('swiper');
            swiper.className = 'swipe-container'; void swiper.offsetWidth;
            swiper.classList.add(dirClass, 'animating');

            try {
                const response = await fetch(targetHref);
                const htmlText = await response.text();

                const parser = new DOMParser();
                const newDoc = parser.parseFromString(htmlText, 'text/html');
                const newMain = newDoc.querySelector('main.app');
                const newTitle = newDoc.querySelector('title') ? newDoc.querySelector('title').innerText : document.title;

                setTimeout(() => {
                    const currentMain = document.querySelector('main.app');
                    if(currentMain && newMain) {
                        currentMain.innerHTML = newMain.innerHTML;
                    }
                    document.title = newTitle;
                    
                    history.pushState({}, '', targetHref);

                    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                    const activeLink = document.querySelector(`.nav-link[href="${targetPath}"]`);
                    if (activeLink) activeLink.classList.add('active');

                    if (window.lucide) lucide.createIcons();
                    if (typeof observeReveals === 'function') observeReveals();
                    if (typeof resetScrollProgress === 'function') resetScrollProgress();
                    
                    if (document.getElementById('carousel-ev0') && typeof initDraggableCarousel === 'function') {
                        initDraggableCarousel('carousel-ev0', 'dots-ev0');
                        initDraggableCarousel('carousel-ev1', 'dots-ev1');
                        initDraggableCarousel('carousel-ev2', 'dots-ev2');
                    }

                    const activeView = document.querySelector('.view.active');
                    if (activeView) activeView.scrollTop = 0;
                    else window.scrollTo(0,0);
                    
                    if (typeof updateNavForView === 'function') {
                        updateNavForView(targetPath === '/' ? 'home' : 'other', 0);
                    }
                }, 400);

            } catch (error) {
                window.location.href = targetHref;
            }

            setTimeout(() => {
                swiper.classList.remove('animating', dirClass);
                isNavigating = false;
            }, 900);
        });

        window.addEventListener('popstate', () => {
            window.location.reload(); 
        });
    })();
    </script>
