---
layout: default
view: evenimente
permalink: /murdery/
title: Mister Murdery | SSIC
description: "Mister Murdery · 27 octombrie."
---
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
        <style>
            /* ============ TEMĂ MISTER MURDERY (90s analog horror) ============ */
            body.murdery-theme{
                --c-base:#06030b; --c-surface:#0d0716; --c-surface-elevated:#150d22; --c-primary:#4a1d6e;
                --c-accent:#d4f23c; --c-accent-glow:rgba(212,242,60,0.35);
                --c-footer-bg:#040207; --c-nav-bg:rgba(8,4,14,0.88); --c-nav-bg-solid:rgba(8,4,14,0.97);
            }
            body.murdery-theme .app{background-image:none;background-color:#06030b}
            body.murdery-theme nav .nav-link,
            body.murdery-theme nav .logo{text-shadow:1px 0 rgba(255,0,90,.45),-1px 0 rgba(0,240,255,.35)}
            body.murdery-theme nav .nav-link.active{text-shadow:none}
            body.murdery-theme nav .logo img{filter:drop-shadow(1px 0 0 rgba(255,0,90,.5)) drop-shadow(-1px 0 0 rgba(0,240,255,.4))}
            body.murdery-theme footer{border-top:1px solid rgba(212,242,60,.12);position:relative}
            body.murdery-theme footer::after{content:"";position:absolute;inset:0;pointer-events:none;
                background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}

            .murdery-stage{
                position:relative; min-height:100vh; min-height:100dvh; overflow:hidden;
                display:flex; align-items:center; justify-content:center;
                padding:0; --glow:150,175,255;
            }

            /* --- camera: perete de cărămidă + podea --- */
            .murdery-room{position:absolute;inset:0;pointer-events:none}
            .murdery-room .wall{position:absolute;left:0;right:0;top:0;bottom:20%;
                background:
                    linear-gradient(180deg,rgba(6,3,12,.78),rgba(6,3,12,.35) 55%,rgba(6,3,12,.7)),
                    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='64'><rect width='160' height='64' fill='%23281540'/><g fill='none' stroke='%2307030d' stroke-width='3'><path d='M0 32H160M0 0H160M0 64H160M80 0V32M40 32V64M120 32V64'/></g><g fill='%23ffffff' fill-opacity='.03'><rect x='4' y='4' width='72' height='24'/><rect x='88' y='36' width='64' height='24'/></g></svg>");
                background-size:auto,160px 64px}
            .murdery-room .floor{position:absolute;left:0;right:0;bottom:0;height:20%;
                background:
                    linear-gradient(180deg,rgba(0,0,0,.65),rgba(0,0,0,.2) 40%,rgba(0,0,0,.85)),
                    repeating-linear-gradient(90deg,#120a1c 0 118px,#05030a 118px 120px)}
            .murdery-glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
                background:radial-gradient(ellipse 60% 52% at 50% 52%,rgba(var(--glow),.42),rgba(var(--glow),.11) 55%,transparent 78%);
                animation:murderyFlick 5.5s steps(1) infinite}
            @keyframes murderyFlick{0%,100%{opacity:1}12%{opacity:.86}13%{opacity:1}47%{opacity:.92}48%{opacity:1}71%{opacity:.8}72%{opacity:.97}}
            .murdery-vig{position:absolute;inset:0;pointer-events:none;
                background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(0,0,0,.88) 100%)}
            .murdery-scan{position:absolute;inset:0;pointer-events:none;opacity:.5;
                background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}

            /* --- televizorul (placeholder CSS; se poate înlocui cu randarea din Blender) --- */
            .tv-wrap{
                --tvw:min(94vw,1000px,calc((100dvh - 240px) * 1.3));
                --u:calc(var(--tvw) / 100);
                position:relative; z-index:2; width:var(--tvw); margin-top:calc(var(--u) * 15);
            }
            .ants{position:absolute;left:50%;bottom:100%;width:0;height:0;z-index:0;pointer-events:none}
            .ants i{position:absolute;bottom:0;left:0;width:max(2px,calc(var(--u)*.32));height:calc(var(--u)*19);
                background:linear-gradient(#d6d0dd,#6b6473);border-radius:2px;transform-origin:50% 100%}
            .ants i:nth-child(1){transform:rotate(-31deg)}
            .ants i:nth-child(2){transform:rotate(27deg)}
            .ants b{position:absolute;left:0;bottom:calc(var(--u)*-.6);width:calc(var(--u)*8);height:calc(var(--u)*3.2);
                transform:translateX(-50%);border-radius:50% 50% 0 0;background:linear-gradient(#4b4552,#1a161e)}

            .tv{
                position:relative; z-index:1; display:grid; grid-template-columns:1fr 17%; gap:3.2%;
                padding:4.2% 3.2% 4.2% 4.2%; border-radius:5% / 7%;
                background:linear-gradient(160deg,#3d3742 0%,#27232c 45%,#16131a 100%);
                box-shadow:
                    0 0 0 calc(var(--u)*.35) #09070c,
                    inset 0 calc(var(--u)*.3) 0 rgba(255,255,255,.13),
                    inset 0 calc(var(--u)*-1) calc(var(--u)*2.2) rgba(0,0,0,.65),
                    0 calc(var(--u)*3) calc(var(--u)*7) rgba(0,0,0,.85),
                    0 0 calc(var(--u)*14) rgba(var(--glow),.12);
            }
            .tv-bezel{border-radius:9% / 12%;padding:2.6%;background:#0a080d;
                box-shadow:inset 0 0 calc(var(--u)*2.4) #000,0 0 0 calc(var(--u)*.3) rgba(255,255,255,.05)}
            .tv-screen{position:relative;aspect-ratio:4 / 3;border-radius:7% / 9.5%;overflow:hidden;background:#000;
                outline:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;
                box-shadow:inset 0 0 calc(var(--u)*7) rgba(0,0,0,.95),0 0 calc(var(--u)*3) rgba(var(--glow),.35)}
            .tv-screen:focus-visible{box-shadow:0 0 0 calc(var(--u)*.6) var(--c-accent)}
            .tv-scan{position:absolute;inset:0;pointer-events:none;
                background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px)}
            .tv-vig{position:absolute;inset:0;pointer-events:none;
                background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.72) 100%)}
            .tv-track{position:absolute;left:0;right:0;top:-20%;height:16%;pointer-events:none;opacity:0;
                background:linear-gradient(transparent,rgba(255,255,255,.12),transparent)}
            .murdery-stage.is-glitching .tv-track{animation:murderyTrack .45s linear}
            .murdery-stage.is-glitching .tv-bezel{animation:murderyJit .11s steps(2) infinite}
            @keyframes murderyTrack{0%{top:-20%;opacity:1}100%{top:105%;opacity:1}}
            @keyframes murderyJit{0%{transform:translate(-.25%,0)}50%{transform:translate(.35%,.1%)}100%{transform:translate(0,-.1%)}}

            .tv-side{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7% 0 6%}
            .dial{width:68%;aspect-ratio:1;border-radius:50%;position:relative;
                background:radial-gradient(circle at 35% 30%,#5c5461,#1c1820 70%);
                box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.1) #000,inset 0 0 0 calc(var(--u)*.4) #0b090e;
                transform:rotate(var(--r,0deg));transition:transform .45s cubic-bezier(.2,1,.2,1)}
            .dial::after{content:"";position:absolute;left:50%;top:9%;width:8%;height:32%;transform:translateX(-50%);
                background:#d3cdda;border-radius:2px}
            .grille{width:72%;height:26%;border-radius:calc(var(--u)*.6);
                background:repeating-linear-gradient(0deg,#08060b 0 calc(var(--u)*.45),#2b262f calc(var(--u)*.45) calc(var(--u)*1.3));
                box-shadow:inset 0 0 calc(var(--u)*1) #000}
            .led{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);border-radius:50%;background:#ff2a3d;
                box-shadow:0 0 calc(var(--u)*2.4) #ff2a3d;animation:murderyLed 3.2s ease-in-out infinite}
            @keyframes murderyLed{0%,100%{opacity:1}50%{opacity:.45}}

            .tv-feet{display:flex;justify-content:space-between;padding:0 11%;position:relative;z-index:0}
            .tv-feet i{display:block;width:9%;height:calc(var(--u)*2.2);background:#0d0b10;border-radius:0 0 calc(var(--u)*.7) calc(var(--u)*.7)}
            .tv-table{position:relative;z-index:1;width:112%;margin:0 -6%;height:calc(var(--u)*4.4);border-radius:calc(var(--u)*.5);
                background:linear-gradient(#7d5148,#4b2c34 55%,#2a1620);
                box-shadow:0 calc(var(--u)*.4) 0 #170b12,0 calc(var(--u)*3) calc(var(--u)*5) rgba(0,0,0,.9),
                           inset 0 calc(var(--u)*.3) 0 rgba(255,255,255,.18),0 calc(var(--u)*-1) calc(var(--u)*9) rgba(var(--glow),.18)}

            @media (max-width:600px){
                .murdery-stage{padding:96px 2vw 36px}
                .tv-wrap{--tvw:min(96vw,calc((100dvh - 220px) * 1.3))}
                .tv{grid-template-columns:1fr 13%;gap:2.4%}
            }
            @media (prefers-reduced-motion:reduce){
                .murdery-glow,.led{animation:none}
                .murdery-stage.is-glitching .tv-bezel,.murdery-stage.is-glitching .tv-track{animation:none}
            }
        
            /* --- jocul: ecranul TV <-> fullscreen --- */
            #mView{position:absolute;inset:0;overflow:hidden;background:#000;container-type:size;font-family:'Pixelify Sans',monospace;font-weight:600;color:#fff;-webkit-user-select:none;user-select:none}
            #mC{position:absolute;left:50%;top:50%;width:min(100%,calc(100dvh * 4 / 3));aspect-ratio:4 / 3;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;filter:contrast(1.08) saturate(1.1)}
            #mTui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqw;text-align:center;background:radial-gradient(rgba(0,0,0,.7),rgba(0,0,0,.25))}
            #mTui[hidden]{display:none}
            #mTui h1{margin:0;font-weight:400;font-size:10cqw;line-height:1.2;color:#d4f23c;text-shadow:.5cqw .5cqw 0 #000,.8cqw .8cqw 0 #4a1d6e}
            #mTui.pv{justify-content:flex-end;gap:1cqw;background:none;padding-bottom:1.5cqw}#mTui.pv h1,#mTui.pv #mLv{display:none}#mTui.pv #mMsg{font-size:2.8cqw;min-height:0}#mTui.pv .mb{font-size:3.4cqw;padding:1cqw 3cqw}
            #mMsg{font-size:3cqw;line-height:1.7;color:#ffd23f;text-shadow:.3cqw .3cqw 0 #000;min-height:1.7em}
            .mrow{display:flex;gap:2cqw;align-items:center;justify-content:center}
            .mb{font-family:inherit;font-size:4.2cqw;color:#fff;background:#6b2fa0;border:.6cqw solid #fff;padding:1.5cqw 3.6cqw;cursor:pointer;box-shadow:.7cqw .7cqw 0 #2a0f48;text-shadow:.3cqw .3cqw 0 #0006}
            .mb:hover{background:#8a4fc4}.mb:active{transform:translate(.5cqw,.5cqw);box-shadow:none}
            .mb.sm{font-size:3.4cqw;padding:1.2cqw 2cqw}
            .mc{width:6.5cqw;height:6.5cqw;font-family:inherit;font-size:3.6cqw;color:#fff;background:#6b2fa0;border:.5cqw solid #fff;cursor:pointer;padding:0}
            .mc.ok{background:#2f8a3c}.mc.lk{background:#3a3a3a;color:#888;cursor:not-allowed}
            #mCtl{display:none}
            .fs #mCtl{display:flex;position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));justify-content:space-between;align-items:flex-end;padding:0 max(18px,env(safe-area-inset-left));pointer-events:none;z-index:4;--cs:clamp(98px,26vmin,170px);opacity:.92}
            #mCtl>*{pointer-events:auto}
            .xb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right));font-family:inherit;font-weight:600;font-size:calc(var(--cs) * .26);color:#fff;background:#8a2a3a;border:0;border-radius:0;width:calc(var(--cs) * .42);height:calc(var(--cs) * .42);padding:0;cursor:pointer;text-shadow:var(--p) var(--p) 0 #000;touch-action:none;-webkit-tap-highlight-color:transparent;box-shadow:0 0 0 var(--p) var(--ol),inset calc(var(--p)*-1.5) calc(var(--p)*-1.5) 0 #5a1624,inset var(--p) var(--p) 0 #c0506a}
            .xb:active{background:#6a1c2a;box-shadow:0 0 0 var(--p) var(--ol),inset var(--p) var(--p) 0 #3a0c16}
            @media (orientation:portrait){.fs #mCtl{flex-wrap:wrap;row-gap:14px}}
            /* efect de ecran vechi și în fullscreen */
            @keyframes mflick{0%,100%{filter:contrast(1.08) saturate(1.1) brightness(1)}12%{filter:contrast(1.08) saturate(1.1) brightness(.88)}13%{filter:contrast(1.08) saturate(1.1) brightness(1)}47%{filter:contrast(1.08) saturate(1.1) brightness(.93)}48%{filter:contrast(1.08) saturate(1.1) brightness(1)}71%{filter:contrast(1.08) saturate(1.1) brightness(.84)}72%{filter:contrast(1.08) saturate(1.1) brightness(.97)}}
            @keyframes mjit{0%{transform:translate(calc(-50% - .3%),-50%)}50%{transform:translate(calc(-50% + .4%),calc(-50% + .1%))}100%{transform:translate(-50%,calc(-50% - .1%))}}
            .fs #mC{border-radius:3% / 4%;animation:mflick 5.5s steps(1) infinite}
            .fs .tv-scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.36) 0 1px,transparent 1px 3px)}
            .fs .tv-vig{background:radial-gradient(ellipse at 50% 50%,transparent 46%,rgba(0,0,0,.8) 100%)}
            .fs .tv-track{animation:murderyTrack 7s linear infinite}
            .gl #mC{animation:mjit .11s steps(2) infinite}.gl .tv-track{animation:murderyTrack .45s linear infinite}

            /* sticlă: reflexii dure, fără gradienți */
            .tv-glass{position:absolute;inset:0;pointer-events:none;background:rgba(255,255,255,.07);clip-path:polygon(0 0,34% 0,0 46%)}
            .tv-glass::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.05);clip-path:polygon(40% 0,47% 0,0 68%,0 58%)}
            .fs .tv-scan,.fs .tv-vig,.fs .tv-glass{inset:auto;left:50%;top:50%;width:min(100%,calc(100dvh * 4 / 3));aspect-ratio:4 / 3;transform:translate(-50%,-50%)}
            .fs .tv-track{display:none}
            .fs .tv-glass{display:none}
            /* ===== controale pixel / retro ===== */
            #mCtl{--p:calc(var(--cs) * .04);--ol:#000}
            .dp,.gb,.pl{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
            .dp{--p:calc(var(--cs) * .055);position:relative;width:calc(var(--cs) * 1.2);height:calc(var(--cs) * 1.2)}
            .dp .sh{position:absolute;inset:0}
            .dp .cr{position:absolute;inset:0;background:#4a4a58;clip-path:polygon(33% 0,67% 0,67% 33%,100% 33%,100% 67%,67% 67%,67% 100%,33% 100%,33% 67%,0 67%,0 33%,33% 33%);
                box-shadow:inset 0 0 0 var(--p) var(--ol),inset calc(var(--p)*-2) calc(var(--p)*-2) 0 var(--p) #2c2c36,inset var(--p) var(--p) 0 var(--p) #6a6a7a}
            .dp s{position:absolute;left:41%;top:41%;width:18%;height:18%;background:#2c2c36;box-shadow:0 0 0 var(--p) var(--ol)}
            .dp b{position:absolute;background:#9a9aa8;pointer-events:none}
            .dp b.u{left:42%;top:8%;width:16%;height:13%;clip-path:polygon(40% 0,60% 0,60% 33%,80% 33%,80% 66%,100% 66%,100% 100%,0 100%,0 66%,20% 66%,20% 33%,40% 33%)}
            .dp b.d{left:42%;bottom:8%;width:16%;height:13%;clip-path:polygon(0 0,100% 0,100% 34%,80% 34%,80% 67%,60% 67%,60% 100%,40% 100%,40% 67%,20% 67%,20% 34%,0 34%)}
            .dp b.l{left:8%;top:42%;width:13%;height:16%;clip-path:polygon(0 40%,33% 40%,33% 20%,66% 20%,66% 0,100% 0,100% 100%,66% 100%,66% 80%,33% 80%,33% 60%,0 60%)}
            .dp b.r{right:8%;top:42%;width:13%;height:16%;clip-path:polygon(100% 40%,67% 40%,67% 20%,34% 20%,34% 0,0 0,0 100%,34% 100%,34% 80%,67% 80%,67% 60%,100% 60%)}
            .dp.l b.l,.dp.r b.r,.dp.u b.u{background:#d4f23c}
            .ab{display:flex;align-items:flex-end;gap:calc(var(--cs) * .12);margin-bottom:calc(var(--cs) * .05)}
            .ab>div{display:flex;flex-direction:column;align-items:center;gap:calc(var(--p)*1.5)}
            .ab>div:last-child{margin-bottom:calc(var(--cs) * .3)}
            .ab small{font-size:calc(var(--cs) * .15);color:#fff;font-weight:600;text-shadow:var(--p) var(--p) 0 #000}
            .gb{position:relative;width:calc(var(--cs) * .56);height:calc(var(--cs) * .56);border:0;padding:0;cursor:pointer;outline:none;font-family:inherit;font-weight:600;font-size:calc(var(--cs) * .24);color:#fff;text-shadow:var(--p) var(--p) 0 #5a0f34;background:#d02c7a;
                clip-path:polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%);
                box-shadow:inset 0 0 0 calc(var(--p)*1.5) var(--ol),inset 0 calc(var(--p)*-3) 0 calc(var(--p)*1.5) #8a1650,inset 0 calc(var(--p)*2) 0 calc(var(--p)*1.5) #f06aa8}
            .gb.on{background:#a82262;text-shadow:none;box-shadow:inset 0 0 0 calc(var(--p)*1.5) var(--ol),inset 0 calc(var(--p)*3) 0 calc(var(--p)*1.5) #6a0f3a}
            .mid{display:flex;gap:calc(var(--cs) * .16);align-self:flex-end;margin-bottom:calc(var(--cs) * .04)}
            .pl{font-family:inherit;font-weight:600;font-size:calc(var(--cs) * .14);color:#fff;background:#4a4a58;border:0;border-radius:0;padding:.45em .9em;cursor:pointer;
                box-shadow:0 0 0 var(--p) var(--ol),inset calc(var(--p)*-1) calc(var(--p)*-1) 0 #2c2c36,inset var(--p) var(--p) 0 #6a6a7a}
            .pl:active{background:#3a3a46;box-shadow:0 0 0 var(--p) var(--ol),inset var(--p) var(--p) 0 #2c2c36}
            @media (orientation:portrait){.fs #mCtl{flex-wrap:wrap;row-gap:14px}.mid{order:3;flex-basis:100%;justify-content:center;margin:0}}
            .rm *,.rm{animation:none!important}

            /* ===== scena din Blender: randare + ecran (zona verde) ===== */
            .murdery-stage{padding:0;min-height:0;height:100vh;height:100dvh}
            .scene{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;aspect-ratio:9 / 16;width:max(100vw,calc(100dvh * 9 / 16))}
            .scene-bg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-select:none;user-select:none}
            /* zona verde din randare: x 208-874, y 675-1176 din 1080x1920 */
            .scene .tv-screen{position:absolute;left:19.26%;top:35.16%;width:61.76%;height:26.15%;aspect-ratio:auto;border-radius:1.4% / 1.9%;cursor:default;box-shadow:inset 0 0 14px rgba(0,0,0,.9)}
            .murdery-glow{opacity:.35}
            /* PC / landscape: randarea 16:9 (zona verde: x 1005-1624, y 424-888 din 2560x1440) */
            @media (min-aspect-ratio:1 / 1){
                .scene{aspect-ratio:16 / 9;width:max(100vw,calc(100dvh * 16 / 9))}
                .scene .tv-screen{left:39.26%;top:29.44%;width:24.22%;height:32.29%;border-radius:1.2% / 1.7%}
            }
            /* ===== ecran: doar „JOACĂ” mare peste purici ===== */
            #mTui h1,#mTui #mLv{display:none!important}
            #mTui:not(.pv) #mPlay{position:absolute;left:0;top:0;width:100%;height:100%;padding:0;border:0;box-shadow:none;background:none;font-size:21cqw;line-height:1;letter-spacing:.8cqw;color:#d4f23c;text-shadow:1cqw 1cqw 0 #000,1.8cqw 1.8cqw 0 #4a1d6e;animation:mblink 1.1s steps(2) infinite}
            #mTui:not(.pv) #mPlay:hover{color:#fff}
            #mTui:not(.pv) #mPlay:active{transform:none}
            #mTui:not(.pv) .mrow{display:contents}
            #mTui:not(.pv) #mPp,#mTui:not(.pv) #mPn{position:absolute;bottom:3cqw;z-index:2}
            #mTui:not(.pv) #mPp{left:3cqw}#mTui:not(.pv) #mPn{right:3cqw}
            #mTui:not(.pv) #mMsg{position:absolute;left:0;right:0;bottom:13cqw;z-index:2}
            #mTui:not(.pv) .mrow .mb.sm{opacity:.85}
            @keyframes mblink{50%{opacity:.62}}
            /* tranziții cu glitch: TV -> joc (gx) și joc -> TV (gi) */
            #mTui.gx{animation:mgx .65s steps(1) forwards}
            @keyframes mgx{0%{transform:none}10%{transform:translate(-4%,0) skewX(10deg);filter:hue-rotate(120deg)}22%{transform:translate(5%,2%);opacity:.85}35%{transform:translate(-2%,-3%) scaleY(1.25);filter:invert(1)}50%{transform:translate(3%,1%) skewX(-12deg);opacity:.5;filter:none}70%{transform:translate(-6%,0);opacity:.25}100%{transform:none;opacity:0}}
            #mTui.gi{animation:mgi .75s steps(1) both}
