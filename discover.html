    color: #111;

}

/* ── Sticker atașat la anumite rânduri ── */
.ds-sticker {
    flex: 0 0 auto;
    width: 70px;
    animation: swayRot 3s ease-in-out infinite alternate;
    filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.2));

@keyframes swayRot {
    0%   { transform: rotate(-9deg); }
    100% { transform: rotate(9deg); }
}
.ds-sticker.s2 { animation-delay: -1.1s; }
.ds-sticker.s3 { animation-delay: -2.3s; }

/* Slot vuoi per aliniamento cand nu e sticker */
.ds-sticker-placeholder {

    width: 62px;

<script>
(function () {
    // Caractere haotice — niciun cuvânt real posibil
    const POOL = '█▓▒░▐▌▄▀■□●◆◇○◉⌂⌬#@!&%$?*^~≠≡±×÷√∞∫∂∑∏∆ΩΨΦαβγδεζθΣΠ01{}[]<>|\\//';

    function rand() { return POOL[Math.floor(Math.random() * POOL.length)]; }
    function scramble(len) {
        let s = '';
        for (let i = 0; i < len; i++) {
            s += (i > 0 && i % (4 + Math.floor(Math.random()*4)) === 0) ? ' ' : rand();
        }
        return s;
    }

    // Titlu — fiecare cuvânt scrambled separat la fiecare frame
    const elDiscover = document.getElementById('ds-discover');
    const elSsic = document.getElementById('ds-ssic');

    function animTitle() {
        elDiscover.textContent = scramble(8);
        elSsic.textContent = scramble(4);
        requestAnimationFrame(animTitle);
    }
    animTitle();

    // Casete — interval mai lent (80ms) ca să pară "bruiat" nu amestecat
    document.querySelectorAll('.ds-glitch').forEach(function (el) {
        const len = parseInt(el.dataset.len) || 20;
        function animBox() {
            el.textContent = scramble(len);
            setTimeout(animBox, 70 + Math.random() * 80);
        }
        animBox();
    });
})();
</script>
