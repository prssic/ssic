<script>
(function () {
    // Doar litere mari + câteva cifre — fără simboluri
    const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

    function randChar() {
        return LETTERS[Math.floor(Math.random() * LETTERS.length)];
    }

    // Înlocuiește literele din textul original cu litere random
    // — păstrează spațiile ca să nu pară un bloc solid
    function scramble(original) {
        let result = '';
        for (let i = 0; i < original.length; i++) {
            if (original[i] === ' ') {
                result += ' ';
            } else {
                // 15% șanse să păstrăm litera originală (creează iluzia că "aproape" se descifrează)
                result += Math.random() < 0.15 ? original[i] : randChar();
            }
        }
        return result;
    }

    // Titlul NU se glitchuiește — rămâne static

    // Casetele — mai lent: la fiecare 180-280ms
    document.querySelectorAll('.ds-glitch').forEach(function (el) {
        const original = el.dataset.text || '';
        function animBox() {
            el.textContent = scramble(original);
            setTimeout(animBox, 180 + Math.random() * 100);
        }
        animBox();
    });
})();
</script>
