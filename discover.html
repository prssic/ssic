<style>
/* ── Checkerboard — fundal paginii (CSS pur, fără data-URI/filter —
   ca să randeze garantat și în producție, indiferent de CSP) ── */
body {
    background: #e8f05e !important;
    overflow-x: hidden;
}
.ds-checker-bg {
    position: fixed;
    top: -8%;
    left: -8%;
    width: 116%;
    height: 116%;
    z-index: -2;
    background-color: #e8f05e;
    background-image: repeating-conic-gradient(#c060b8 0% 25%, #e8f05e 0% 50%);
    background-size: 72px 72px;
    pointer-events: none;
    transform-origin: center center;
    animation: checkerBreathe 22s ease-in-out infinite alternate;
    will-change: transform, background-position;
}
@keyframes checkerBreathe {
    0%   { transform: rotate(0deg) skew(0deg, 0deg) scale(1);        background-position: 0px 0px; }
    25%  { transform: rotate(0.6deg) skew(1.1deg, 0.4deg) scale(1.012); background-position: 14px -8px; }
    50%  { transform: rotate(0deg) skew(-0.3deg, -0.8deg) scale(1.02); background-position: -6px 10px; }
    75%  { transform: rotate(-0.6deg) skew(-1.1deg, 0.5deg) scale(1.012); background-position: -14px 6px; }
    100% { transform: rotate(0deg) skew(0deg, 0deg) scale(1);        background-position: 0px 0px; }
}

/* ══════════════════════════════════════════════════════════════
   INTRARE DRAMATICĂ pt. titlu — "anunț important", o singură dată
   la încărcarea paginii. Respectă reduce-motion: dacă e activă
   opțiunea din panoul de accesibilitate (html.a11y-reduce-motion)
   sau preferința sistemului (prefers-reduced-motion), regula
   globală din default.html forțează animation-duration:0.001ms pe
   *tot*, deci efectul dispare practic instant — plus dezactivăm
   explicit mai jos pentru prefers-reduced-motion, ca back-up.
   ══════════════════════════════════════════════════════════════ */
.ds-title-discover, .ds-title-dates, .ds-title-ssic {
    opacity: 0;
    animation: ds-intro-stamp 0.85s cubic-bezier(.2,1.4,.4,1) forwards;
}
.ds-title-discover { animation-delay: 0.05s; }
.ds-title-dates    { animation-delay: 0.30s; }
.ds-title-ssic      { animation-delay: 0.40s; }

@keyframes ds-intro-stamp {
    0%   { opacity: 0; transform: scale(2.6) rotate(-7deg); filter: blur(9px); }
    48%  { opacity: 1; transform: scale(0.9) rotate(2.5deg); filter: blur(0); }
    66%  { transform: scale(1.09) rotate(-1.5deg); }
    82%  { transform: scale(0.97) rotate(0.6deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

/* Puls discret, continuu, pe titlu — ca să pară în atenție/"urgent",
   nu doar la intrare. Pornește după ce s-a terminat "stamp"-ul. */
.ds-title-block { animation: ds-intro-glow 3.4s ease-in-out 1.3s infinite; }
@keyframes ds-intro-glow {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(192,96,184,0)); }
    50%      { filter: drop-shadow(0 0 14px rgba(192,96,184,0.55)); }
}

/* Rândurile cu evenimente intră în cascadă, imediat după titlu */
.ds-row {
    opacity: 0;
    animation: ds-row-in 0.6s cubic-bezier(.2,1,.3,1) forwards;
}
.ds-row:nth-child(2) { animation-delay: 0.55s; }
.ds-row:nth-child(3) { animation-delay: 0.68s; }
.ds-row:nth-child(4) { animation-delay: 0.81s; }
.ds-row:nth-child(5) { animation-delay: 0.94s; }
.ds-row:nth-child(6) { animation-delay: 1.07s; }
@keyframes ds-row-in {
    0%   { opacity: 0; transform: translateX(-26px); }
    100% { opacity: 1; transform: translateX(0); }
}
.ds-row.star-right { animation-name: ds-row-in-right; }
@keyframes ds-row-in-right {
    0%   { opacity: 0; transform: translateX(26px); }
    100% { opacity: 1; transform: translateX(0); }
}

@media (prefers-reduced-motion: reduce) {
    .ds-title-discover, .ds-title-dates, .ds-title-ssic, .ds-row {
        animation: none !important; opacity: 1 !important; transform: none !important; filter: none !important;
    }
    .ds-title-block { animation: none !important; }
}

<script>
(function () {
    const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';

    // Titlurile evenimentelor NU stau ca text simplu în pagină — sunt encodate
    // și decodate abia în browser, în ordinea rândurilor (LUNI → VINERI).
    const ENCODED = [
        "UHJlemVudGFyZSBTU0lDLSBKb2MgZGUgY3Vub2HImXRlcmU=",
        "UGhvdG8gU2NhdmVuZ2VyIEh1bnQ=",
        "VHJpdmlhIE5pZ2h0IFNTSUMgeCBMU0ZTQSB4IFlBSU1N",
        "QmluZ28gTXV6aWNhbCAmIFVuaVN0YXJ0IFBhcnR5",
        "R2V0IHRvIGtub3cgQnVjaGFyZXN0IGZ0LiBTU0lD"
    ];

    function decode(b64) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }

    function randChar() {
        return LETTERS[Math.floor(Math.random() * LETTERS.length)];
    }

    document.querySelectorAll('.ds-glitch').forEach((el, i) => {
        const orig = decode(ENCODED[i] || '');

        function randomizeText() {
            let newText = '';
            for (let c = 0; c < orig.length; c++) {
                if (orig[c] === ' ' || orig[c] === '-') {
                    newText += orig[c]; // Preserve only spaces/hyphens, for word-shape/spacing
                } else {
                    // Always a fresh random letter — the real character is never
                    // shown, so nothing ever reads as a recognizable word
                    newText += randChar();
                }
            }
            el.textContent = newText;
        }

        randomizeText();
        setInterval(randomizeText, 1); // as fast as the browser allows (browsers clamp small intervals to ~4ms) — pure noise, no legible text
    });
})();
</script>
