.ds-sticker {

    height: 66px;

    100% { transform: rotate(9deg);  }

    .ds-sticker-placeholder { flex: 0 0 52px; width: 52px; }
    .ds-row   { padding: 0 6px; }

<script>
(function () {
    const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

    function randChar() {
        return LETTERS[Math.floor(Math.random() * LETTERS.length)];
    }

    document.querySelectorAll('.ds-glitch').forEach(el => {
        let orig = el.getAttribute('data-orig') || '';
        
        function randomizeText() {
            let newText = '';
            for (let i = 0; i < orig.length; i++) {
                if (orig[i] === ' ' || orig[i] === '-') {
                    newText += orig[i]; // Preserve spaces and hyphens
                } else {
                    newText += randChar();
                }
            }
            el.innerText = newText;
        }

        randomizeText();
        setInterval(randomizeText, 800 + Math.random() * 400);
    });
})();
</script>
