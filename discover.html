<script>
/* Navbar ascuns la deschidere, apare la scroll (desktop + mobil).
   Scroll-ul acestui site NU e pe window (html/body au overflow:hidden), ci pe containerul
   .view — de-asta ascultăm #view-discover. Folosim aceeași clasă `nav-hidden` ca pe Acasă,
   deci animația/tranziția vin direct din default.html. */
(function () {
    const root = document.documentElement;
    const THRESHOLD = 24;
    const supportsHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    let nearTop = false;

    // Ascuns din primul moment (navbar-ul există deja în DOM, înaintea conținutului) — fără flash.
    const navNow = document.querySelector('nav');
    if (navNow) navNow.classList.add('nav-hidden');

    function apply() {
        const view = document.getElementById('view-discover');
        const nav = document.querySelector('nav');
        if (!view || !nav) return;
        const top = view.scrollTop;
        root.classList.toggle('ds-scrolled', top > THRESHOLD);
        const menu = document.getElementById('navLinks');
        const keepOpen = nearTop || nav.contains(document.activeElement) ||
                         (menu && menu.classList.contains('nav-open'));
        nav.classList.toggle('nav-hidden', top <= THRESHOLD && !keepOpen);
    }

    // Pe desktop, ca pe Acasă: navbar-ul reapare dacă duci cursorul lângă marginea de sus.
    if (supportsHover) {
        document.addEventListener('mousemove', function (e) {
            const near = e.clientY < 120;
            if (near !== nearTop) { nearTop = near; apply(); }
        });
    }
    document.addEventListener('focusin', apply);
    document.addEventListener('focusout', function () { setTimeout(apply, 0); });

    document.addEventListener('scroll', function (e) {
        if (e.target && e.target.id === 'view-discover') apply();
    }, true);

    // default.html cheamă updateNavForView(...) la încărcare și scoate `nav-hidden`;
    // reaplicăm după el (DOMContentLoaded/load vin după scripturile din pagină).
    document.addEventListener('DOMContentLoaded', apply);
    window.addEventListener('load', apply);
    window.addEventListener('pageshow', apply);
    apply();

    /* Rândurile cu evenimente se animează când ajung în ecran, nu în timp ce sunt încă sub hero. */
    if ('IntersectionObserver' in window) {
        root.classList.add('ds-io');
        const io = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
            });
        }, { threshold: 0.15 });
        const observeRows = function () {
            document.querySelectorAll('.ds-row').forEach(function (r) { io.observe(r); });
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', observeRows);
        else observeRows();
        window.addEventListener('load', observeRows);
    }
})();
</script>

<!-- Titlurile stau criptate (AES-256-GCM) și se decriptează automat când ceasul ajunge la 0. Cheia e în pagină, deci NU e protecție reală — doar nu se citesc cu Ctrl+F. -->
<script>
(function () {
    // Scramble COMPLET: fără cuvinte, fără punctuație fixă, fără nicio legătură cu titlurile reale.
    // Fiecare poziție primește un caracter nou la fiecare cadru; doar spațiile (inventate) permit trecerea pe rândul următor.
    const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789&.-';
    const SHAPES = [
        'XXXXXXXXXXX XXXX XXXXXXXXXXXX',
        'XXXXX XXXXXXXXXX XXXX',
        'XXXXXX XXXXX XXXX XXXXXXXX',
        'XXXXX XXXXXXX XXXXXXXX',
        'XXX XX XXXXX XXXXXXXXX XXXXXX'
    ];

    // Titlurile evenimentelor (LUNI → VINERI), criptate.
    const ENCRYPTED = [
        "gf7ngL2Kyw9HRMBlG+wpLHgYdp2cvyklc9uoh/+bKPXn87jHKW4UnZXwkCJlfmZP7IDetRLSvboSxSCQfGByTeiy",
        "uOs2Y3VjGcU9NvDqQTf3itL/irbT7yd0fWl6xgeM0svZWnDOQtGPIT9P4CvdaNs+",
        "rmmhNdpa4eVWuNo97wcXTPjSkaP24FVBdalUDwK1niXCsV1vE5EVrOZZvQbAI1FTqlSXpbGFYmhFAeERyQ==",
        "9xDFZNxpfdqnotTKMG83QluHaNlGQKJkbYpaQA32FAlHFU5f1+K7zyjNWVkSskJAHA==",
        "0wFRHRlwBbyA6SS/I7dktGEqglDxLCsZLYAu/vHfRaibAgN4r08q0+zDeUUa84bVw45/1gYSeEU7RQ=="
    ];

    const KEY = 'wgdKCUhXaPZtF/rI4GzC7vuw0pBUAmp+eVvbICdLLzM=';
    const REVEAL_AT = new Date('2026-09-21T12:00:00+03:00').getTime();   // trebuie să fie aceeași oră ca ținta ceasului din layout

    const els = Array.from(document.querySelectorAll('.ds-glitch'));
    const timers = [];
    let started = false;

    els.forEach((el, i) => {
        const shape = SHAPES[i % SHAPES.length];
        function scramble() {
            let t = '';
            for (let c = 0; c < shape.length; c++) {
                t += shape[c] === ' ' ? ' ' : CHARS[Math.floor(Math.random() * CHARS.length)];
            }
            el.textContent = t;
        }
        scramble();
        timers[i] = setInterval(scramble, 45);
    });

    function b64bytes(b64) {
        const bin = atob(b64.trim());
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
    }

    async function decryptAll(keyB64) {
        const key = await crypto.subtle.importKey('raw', b64bytes(keyB64), 'AES-GCM', false, ['decrypt']);
        return Promise.all(ENCRYPTED.map(async (e) => {
            const b = b64bytes(e);
            const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, key, b.slice(12));
            return new TextDecoder('utf-8').decode(buf);
        }));
    }

    function showTitles(names) {
        els.forEach((el, i) => {
            clearInterval(timers[i]);
            el.style.whiteSpace = 'normal';
            el.style.textOverflow = 'clip';
            el.textContent = names[i] || '';
        });
    }

    function start() {           // pornit o singură dată: când ceasul atinge 0
        if (started) return;
        started = true;
        if (!(window.crypto && crypto.subtle)) return;   // fără HTTPS/WebCrypto rămâne scramble-ul
        decryptAll(KEY).then(showTitles).catch(() => {});
    }

    // Semnalul principal: ceasul din layout anunță când ajunge la 00:00:00. REVEAL_AT e plasa de siguranță.
    document.addEventListener('ssic:countdown-end', start);
    setTimeout(start, Math.max(0, REVEAL_AT - Date.now()));
})();

/* Zilele din stele (LUNI … MIERCURI) se micșorează automat dacă nu încap în steluță —
   Safari randează fontul puțin mai lat și clip-path-ul stelei tăia ultimele litere. */
(function () {
    function fitDays() {
        document.querySelectorAll('.ds-star .ds-day').forEach(function (el) {
            el.style.fontSize = '';
            const wrap = el.closest('.ds-star-wrap');
            if (!wrap) return;
            const max = wrap.offsetWidth * 0.6;
            let fs = parseFloat(getComputedStyle(el).fontSize);
            let guard = 0;
            while (el.offsetWidth > max && fs > 6 && guard++ < 40) {
                fs -= 0.25;
                el.style.fontSize = fs + 'px';
            }
        });
    }
    fitDays();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitDays);
    window.addEventListener('load', fitDays);
    window.addEventListener('resize', fitDays);
})();
</script>
