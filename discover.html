/* Scoatem fundalul întunecat al app-ului și al paginii */

.page-content { background: transparent !important; }

/* ── @font-face local Stinger Fit (Varianta FULL) ── */
@font-face {
    font-family: 'Stinger Fit';
    src: url('/assets/fonts/StingerFit-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: 'Stinger Fit';
    src: url('/assets/fonts/StingerFit-Regular.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

/* ── Bloc titlu ── */
.ds-title-block {
    max-width: 620px;
    margin: 0 auto 36px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* "DISCOVER" — static, mare, nav ── */
.ds-title-discover {
    display: block;
    font-family: 'Stinger Fit', Impact, 'Arial Black', sans-serif;
    font-size: clamp(3.5rem, 16vw, 7rem);
    color: #0c2340;
    letter-spacing: 0.02em;
    line-height: 0.92;
    text-shadow: none;
    -webkit-text-stroke: 0;
}

/* Rândul 2: data + "SSIC" pe aceeași linie ── */
.ds-title-row2 {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: nowrap;
    width: 100%;
}
.ds-title-dates {
    font-family: 'Stinger Fit', Impact, sans-serif;
    font-size: clamp(1.1rem, 5vw, 2rem);
    color: #0c2340;
    letter-spacing: 0.05em;
    white-space: nowrap;
}
.ds-title-ssic {
    display: block;
    font-family: 'Stinger Fit', Impact, 'Arial Black', sans-serif;
    font-size: clamp(3.5rem, 16vw, 7.5rem);
    color: #0c2340;
    letter-spacing: 0.02em;
    line-height: 0.92;
    text-shadow: none;
}

/* ── Rândul de casetă ── */
.ds-row {
    position: relative;
    max-width: 560px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    padding: 0 24px;
}
.ds-row.star-right { flex-direction: row-reverse; }

/* ── Steluță starburst ── */

.ds-star-wrap {
    position: relative;
    flex: 0 0 80px;
    width: 80px;
    height: 80px;
    z-index: 3;
    transform: rotate(-5deg);
    margin: 0 -16px;
}
.ds-row.star-right .ds-star-wrap { transform: rotate(5deg); }

.ds-star-shadow,
.ds-star {
    position: absolute;
    inset: 0;
    clip-path: polygon(50.0% 0.0%,57.7% 8.7%,68.1% 3.4%,72.1% 14.3%,83.7% 13.0%,83.5% 24.7%,94.8% 27.7%,90.4% 38.5%,99.8% 45.4%,91.8% 53.9%,98.1% 63.7%,87.6% 68.7%,89.9% 80.1%,78.3% 81.0%,76.3% 92.5%,65.2% 89.2%,59.2% 99.1%,50.0% 92.0%,40.8% 99.1%,34.8% 89.2%,23.7% 92.5%,21.7% 81.0%,10.1% 80.1%,12.4% 68.7%,1.9% 63.7%,8.2% 53.9%,0.2% 45.4%,9.6% 38.5%,5.2% 27.7%,16.5% 24.7%,16.3% 13.0%,27.9% 14.3%,31.9% 3.4%,42.3% 8.7%);
}
/* Umbra e un al doilea vârf de stea, real, așezat sub și în spatele celui colorat — nu filter, ca să se vadă garantat */
.ds-star-shadow {
    background: #1a2a5e;
    transform: translate(var(--star-shadow-x, 5px), var(--star-shadow-y, 5px));
    z-index: 0;
}
.ds-star {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Stinger Fit', Impact, sans-serif;
    font-weight: bold;
    font-size: 1.8rem;
    color: #0c2340;
    line-height: 1;
    z-index: 1;
}
.ds-star .ds-day {
    font-family: 'Stinger Fit', Impact, sans-serif;
    font-size: 0.6rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 2px;
    color: #0c2340;
}

/* ── Pilula ── */
.ds-pill {
    flex: 1;
    background: #f5f4e0;
    border: 3px solid #1a2a5e;
    border-radius: 16px;
    box-shadow: 5px 5px 0 #1a2a5e;
    padding: 12px 16px;
    min-height: 70px;
    display: flex;
    align-items: center;
    position: relative;
    z-index: 2;
    overflow: hidden;
}

/* Textul glitch — DOAR litere, mai lent ── */
.ds-glitch {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(0.75rem, 2.5vw, 1.05rem);
    font-weight: 800;
    color: #0c2340;
    line-height: 1.2;
    letter-spacing: -0.01em;
    text-transform: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
    width: 100%;
}

/* ── Stickere ── */
.ds-sticker {
    flex: 0 0 66px;
    width: 66px;
    height: 66px;
    object-fit: contain;
    animation: swayRot 3s ease-in-out infinite alternate;
    filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.2));
    margin: 0 -6px;
    z-index: 4;
    flex-shrink: 0;
}
.ds-sticker.s2 { animation-delay: -1.1s; }
.ds-sticker.s3 { animation-delay: -2.3s; }

.ds-sticker-placeholder { flex: 0 0 60px; width: 60px; }

@keyframes swayRot {
    0%   { transform: rotate(-9deg); }
    100% { transform: rotate(9deg);  }
}

/* ── Mobile ── */
@media (max-width: 480px) {
    .ds-title-discover { font-size: clamp(3rem, 15vw, 6rem); margin-bottom: 0px; }
    .ds-title-ssic { font-size: clamp(3rem, 15vw, 6rem); }
    .ds-title-dates { font-size: clamp(0.9rem, 4.5vw, 1.4rem); }
    .ds-star-wrap { flex: 0 0 66px; width: 66px; height: 66px; margin: 0 -12px; }
    .ds-star { font-size: 1.5rem; }
    .ds-pill  { padding: 10px 14px; min-height: 60px; border-radius: 14px; }
    .ds-sticker { flex: 0 0 52px; width: 52px; height: 52px; margin: 0 -4px; object-fit: contain; }
    .ds-sticker-placeholder { flex: 0 0 52px; width: 52px; }
    .ds-row   { padding: 0 6px; }
}

.page-content::before { display: none !important; }

<script>
(function () {
    const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';

    // Titlurile evenimentelor NU stau ca text simplu în pagină — sunt encodate
    // și decodate abia în browser, în ordinea rândurilor (LUNI → VINERI).
    const ENCODED = [
        "UHJlemVudGFyZSBTU0lDLSBKb2MgZGUgY3Vub2HImXRlcmU=",
        "UGhvdG8gU2NhdmVuZ2VyIEh1bnQ=",
        "VHJpdmlhIE5pZ2h0IFNTSUMgeCBMU0ZTQSB4IFlBSU1N",
        "QmluZ28gTXV6aWNhbCAmIFVuaVN0YXJ0IFBhcnR5",
        "R2V0IHRvIGtub3cgQnVjaGFyZXN0IGZ0LiBTU0lD"
    ];

    function decode(b64) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }

    function randChar() {
        return LETTERS[Math.floor(Math.random() * LETTERS.length)];
    }

    document.querySelectorAll('.ds-glitch').forEach((el, i) => {
        const orig = decode(ENCODED[i] || '');

        function randomizeText() {
            let newText = '';
            for (let c = 0; c < orig.length; c++) {
                if (orig[c] === ' ' || orig[c] === '-') {
                    newText += orig[c]; // Preserve only spaces/hyphens, for word-shape/spacing
                } else {
                    // Always a fresh random letter — the real character is never
                    // shown, so nothing ever reads as a recognizable word
                    newText += randChar();
                }
            }
            el.textContent = newText;
        }

        randomizeText();
        setInterval(randomizeText, 1); // as fast as the browser allows (browsers clamp small intervals to ~4ms) — pure noise, no legible text
    });
})();
</script>
