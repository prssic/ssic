<script>
(function() {
    // Caractere complet haotice — niciun cuvânt recognoscibil
    const POOL = '█▓▒░▐▌▄▀■□▪▫◆◇○●◉⌂⌁⌀⌁⌬⌭⌮⌯#@!&%$?*^~≠≡±×÷√∞∫∂∑∏∆ΩΨΦΞΛΘΣΠαβγδεζηθ01';

    function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function scramble(len) {
        let s = '';
        for (let i = 0; i < len; i++) {
            s += Math.random() < 0.15 ? ' ' : rand(POOL);
        }
        return s;
    }

    // ── Titlu: sempre scrambled ──
    const titleEl = document.getElementById('ds-title');
    const TITLE_LEN = 12; // "DISCOVER SSIC" has 12 visible chars + space
    function animTitle() {
        titleEl.textContent = scramble(TITLE_LEN + Math.floor(Math.random() * 4));
        requestAnimationFrame(animTitle);
    }
    animTitle();

    // ── Casete: scramble perpetuu independent per casetă ──
    document.querySelectorAll('.ds-glitch').forEach(function(el) {
        const original = el.dataset.glitch;
        const len = original.length;
        function animBox() {
            el.textContent = scramble(len);
            setTimeout(animBox, 60 + Math.random() * 60);
        }
        animBox();
    });
})();
</script>
